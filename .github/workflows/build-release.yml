name: Build and Release

on:
  push:
    branches:
      - main
      - master
      - feat/ai-analysis
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022

    env:
      BUILD_TYPE: Release
      ARTIFACT_NAME: VideoPlay-Windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true
          submodules: recursive

      - name: Pull Git LFS files
        shell: pwsh
        run: git lfs pull

      - name: Configure
        shell: pwsh
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        shell: pwsh
        run: cmake --build build --config $env:BUILD_TYPE --target VideoPlay

      - name: Test
        shell: pwsh
        run: ctest --test-dir build -C $env:BUILD_TYPE --output-on-failure

      - name: Package
        shell: pwsh
        run: |
          $outputDir = "build/bin/$env:BUILD_TYPE"
          $distDir = "dist"
          $zipPath = "$distDir/$env:ARTIFACT_NAME.zip"

          if (!(Test-Path "$outputDir/VideoPlay.exe")) {
            throw "VideoPlay.exe was not found in $outputDir"
          }

          New-Item -ItemType Directory -Force $distDir | Out-Null
          Compress-Archive -Path "$outputDir/*" -DestinationPath $zipPath -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist/${{ env.ARTIFACT_NAME }}.zip
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "dist/$env:ARTIFACT_NAME.zip" `
            --verify-tag `
            --title "VideoPlay ${{ github.ref_name }}" `
            --generate-notes
